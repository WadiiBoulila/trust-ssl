[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust_ssl"
version = "1.0.0"
description = "Additive-Residual Selective Invariance for Self-Supervised Representation Learning in Aerial Imagery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Wadii Boulila" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[tool.setuptools]
packages = ["trust_ssl", "trust_ssl.models", "trust_ssl.data", "trust_ssl.losses", "trust_ssl.eval", "trust_ssl.utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
